name: Desatascar publicación
on:
  push:
    paths: ['.github/workflows/desatascar-pages.yml']
permissions:
  pages: write
  contents: read
jobs:
  cancelar:
    runs-on: ubuntu-latest
    steps:
      - name: Cancelar la publicación atascada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/${{ github.repository }}/pages/deployments/c1b7508bd5fdead37b5f7999bfe28fd24f0808d0/cancel || true
          gh api repos/${{ github.repository }}/pages/deployments/c1b7508bd5fdead37b5f7999bfe28fd24f0808d0 || true
